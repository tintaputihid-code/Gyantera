<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Masuk / Daftar — PlatformApps</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav>
    <div class="container nav-inner">
      <a href="index.html" class="logo">🚀 PlatformApps</a>
    </div>
  </nav>

  <div class="form-container">
    <h2 id="formTitle">Masuk</h2>
    <div id="alert" class="alert"></div>

    <div id="nameGroup" class="form-group hidden">
      <label>Nama Lengkap</label>
      <input type="text" id="name" placeholder="Nama Anda">
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="email" placeholder="email@example.com">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="Minimal 6 karakter">
    </div>

    <button id="submitBtn" class="btn btn-primary" style="width:100%;">Masuk</button>

    <div class="form-link">
      <span id="switchText">Belum punya akun?</span>
      <a href="#" id="switchLink">Daftar</a>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    let isLogin = true;
    const alertBox = document.getElementById('alert');

    function showAlert(msg, type = 'error') {
      alertBox.textContent = msg;
      alertBox.className = `alert alert-${type} show`;
    }

    document.getElementById('switchLink').onclick = (e) => {
      e.preventDefault();
      isLogin = !isLogin;
      document.getElementById('formTitle').textContent = isLogin ? 'Masuk' : 'Daftar';
      document.getElementById('submitBtn').textContent = isLogin ? 'Masuk' : 'Daftar';
      document.getElementById('switchText').textContent = isLogin ? 'Belum punya akun?' : 'Sudah punya akun?';
      document.getElementById('switchLink').textContent = isLogin ? 'Daftar' : 'Masuk';
      document.getElementById('nameGroup').classList.toggle('hidden', isLogin);
      alertBox.classList.remove('show');
    };

    document.getElementById('submitBtn').onclick = async () => {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const name = document.getElementById('name').value.trim();

      try {
        let result;
        if (isLogin) {
          result = await api.login({ email, password });
        } else {
          result = await api.register({ email, password, name });
        }
        localStorage.setItem('token', result.token);
        localStorage.setItem('user', JSON.stringify(result.user));

        const params = new URLSearchParams(window.location.search);
        window.location.href = params.get('redirect') || 'dashboard.html';
      } catch (err) {
        showAlert(err.message);
      }
    };
  </script>
</body>
</html>
